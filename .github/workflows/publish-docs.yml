name: Publish docs

# Обновить только справку (help/) и корневую index.html на gh-pages без пересборки p2.
on:
  workflow_dispatch:

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync deploy from latest gh-pages
        run: bash .github/workflows/sync_gh_pages_deploy.sh prepare

      - name: Update help site
        env:
          DOCS_ONLY: "1"
          REPO_ROOT: .
          DEPLOY_DIR: deploy
        run: python3 .github/workflows/generate_composite.py

      - name: Verify deploy is not stale
        run: bash .github/workflows/sync_gh_pages_deploy.sh ensure-not-stale

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          commit_message: "Update user documentation"
